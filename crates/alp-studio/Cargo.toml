[package]
name="alp-studio"
version="0.1.0"
edition="2021"
publish=false

[[bin]]
name="alp-studio"
path="src/main.rs"

[dependencies]
anyhow="1"
clap={version="4",features=["derive"]}
crossterm="0.29"
ratatui="0.30.2"
reqwest={version="0.12",default-features=false,features=["blocking","json","rustls-tls"]}
serde_json="1"
