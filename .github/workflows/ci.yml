name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Built-in secret hygiene
        run: python3 scripts/secret_scan.py
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Company Studio smoke test
        run: cargo run --locked -q -p alp-studio -- --smoke
      - name: RustSec audit
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit
      - name: Compose syntax
        env:
          ALP_POSTGRES_PASSWORD: ci-only-placeholder-not-a-secret
        run: docker compose config --quiet
      - name: BEAM runtime builds
        run: docker build -t alp-beam-ci runtimes/alp-beam
